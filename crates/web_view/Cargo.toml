[package]
name = "web_view"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/web_view.rs"
doctest = false

[features]
test-support = []

[dependencies]
anyhow.workspace = true
futures.workspace = true
gpui.workspace = true
log.workspace = true
workspace.workspace = true
percent-encoding.workspace = true
serde_json.workspace = true
ui.workspace = true
util.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# On macOS wry always uses WKWebView; its default features are Linux's GTK backend.
wry = { version = "0.57", default-features = false }
# For adding page scripts after the view is made, keyboard focus, snapshots
# and cut-outs for GPUI overlays, which wry doesn't do.
block2.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSBitmapImageRep", "NSImageRep", "objc2-quartz-core"] }
objc2-core-foundation.workspace = true
objc2-core-graphics = { workspace = true, features = ["CGPath"] }
objc2-foundation.workspace = true
objc2-quartz-core = { workspace = true, features = ["CAShapeLayer", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
    "block2",
    "objc2-app-kit",
    "std",
    "WKSnapshotConfiguration",
    "WKUserContentController",
    "WKUserScript",
    "WKWebView",
] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
settings = { workspace = true, features = ["test-support"] }
theme = { workspace = true, features = ["test-support"] }
theme_settings.workspace = true
workspace = { workspace = true, features = ["test-support"] }
